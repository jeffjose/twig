# twig settings. Saved changes take effect at the next prompt; if the file
# has a mistake, the last good settings stay and the prompt says so.
# `twig info` reads this file, says what is wrong, and shows the prompt it makes.

[prompt]
# {name} is a variable, {name:style} gives it a style, {"text":style} is
# styled text, {$VAR} is an environment variable. Anything in [ ] is left out
# when every variable inside it is empty. \[ \] \{ \} for the characters.
#
# Variables:
#   time host fqdn user ip cwd (with ~) pwd (in full) dir symbol status duration
#   git (all of the status below, together)
#   git_branch git_ahead git_behind git_staged git_changed git_untracked
#   git_stash git_conflicts git_clean git_dirty git_state
#   git_remote ("." even with upstream, "(ahead.2", " (behind.1")
#   git_age (since the last commit: 12m, 3h, 2w)
#   jobs notice load
#   battery (85% +12W charging, 85% -8.4W on battery, 100% full; colored
#     green, orange, muted, and red when low), or its parts: battery_pct
#     battery_watts battery_time (until empty, or until full)
#   and the name of each [[probe]]
format = """
-({time:cyan} {host:host} {ip:host} {cwd:green,bold}[ {git_branch:magenta}[ {git}]])-[ {jobs}][ {notice}]
{symbol} """

# Used instead when the line above doesn't fit the terminal: all of it
# still, over more lines. A line break inside [ ] goes with the group, so
# jobs and the notice get a line each only when there is one.
narrow = """
-({time:cyan} {host:host} {ip:host}
 {cwd:green,bold}[ {git_branch:magenta}[ {git}]])-[
 {jobs}][
 {notice}]
{symbol} """

# At the right edge: of the line above the cursor when the prompt has two
# lines (tcsh shows no right prompt then), else of the line you type on.
right = "[{duration}][ {status}]"

time = "%H:%M:%S"
symbol = "%"
symbol_style = "bold"
symbol_error_style = "red,bold"
duration_min = "2s"

# The color of each machine, for the `host` style. Patterns may use * and ?.
# The full host name is tried first, then the short one.
[hosts]
# "laptop*" = "blue"
# "*.example.com" = "orange"

[git]
wait = "80ms"      # how long a prompt waits for a fresh status
fetch = "15m"      # fetch in the background to see what's new upstream; "off" to not
poll = "1m"        # look again at repositories with a shell in them

# What goes before each count; these are the defaults.
[git.marks]
ahead = "↑"
behind = "↓"
staged = "+"
changed = "~"
untracked = "?"
conflicts = "="
stash = "≡"
clean = "✔"
dirty = "*"

[live]
enabled = true     # redraw the line above the cursor when it changes

[disk]
paths = ["/", "~"]
warn = 90

[battery]
low = 15           # percent: below it, on battery, a notice says how long is left
                   # (an error at 5%); read every 15s

[units]
enabled = true     # say when a systemd unit has failed

[history]
size = 10000
ignore = []        # e.g. ["ls", "cd *"]
key = "^R"         # opens the history search

[jobs]
desktop_after = "30s"

# A probe runs a command now and then. Its first line of output is the
# variable {name}; `notice` is shown while the command fails.
#
# [[probe]]
# name = "vpn"
# run = "ip link show tun0 >/dev/null 2>&1 && echo vpn"
# every = "10s"
#
# [[probe]]
# name = "certs"
# run = "test -f ~/.cert/valid"
# every = "5m"
# hosts = ["work*"]
# notice = "certificate expired: run renew"
# level = "error"
